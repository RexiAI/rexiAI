# Availability config — fallback when env vars not set.
# Env overrides (Vercel env vars) take precedence if any is set:
#   AVAILABILITY_TIMEZONE — IANA timezone (e.g. Europe/Madrid, America/New_York)
#   AVAILABILITY_HOURS — daily windows "HH:MM-HH:MM[,HH:MM-HH:MM]*" e.g. "09:00-13:00,14:00-18:00"
#   AVAILABILITY_DAYS — weekdays "monday,tuesday,wednesday,thursday,friday"
#   CALENDAR_PROVIDER — google | microsoft (default google); EMAIL_PROVIDER — gmail | microsoft365 (default gmail)
#   MICROSOFT_* — Graph credentials when using Microsoft 365 (see .env.example for setup steps).
#   Recording guarantee: owner must enable Teams meeting policy AllowCloudRecording true (Global policy).
#   Billing: prepaid reservation + pro-rata post-pay via POST /api/bookings/recorded-billing (50 cents/min, 60 min free once).
# When any AVAILABILITY_* env var is set, weekly is built from AVAILABILITY_DAYS + AVAILABILITY_HOURS
# and exceptions are empty; otherwise this file is used (weekly + exceptions).
timezone: Europe/Madrid
weekly:
  monday:
    - { start: '09:00', end: '13:00' }
  tuesday:
    - { start: '09:00', end: '13:00' }
  wednesday:
    - { start: '09:00', end: '13:00' }
  thursday:
    - { start: '09:00', end: '13:00' }
  friday:
    - { start: '09:00', end: '13:00' }
exceptions: {}
